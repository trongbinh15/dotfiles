[metadata]
name = "az-devops-pr"
description = "Azure DevOps pull requests — preview, open, checkout, view builds (ctrl-v)"
requirements = ["az"]

[source]
command = "az repos pr list --query \"[?isDraft==\\`false\\`].{id:pullRequestId, title:title, branch:sourceRefName, repo:repository.name}\" -o tsv 2>/dev/null"

[preview]
command = "az repos pr show --id '{split:\\t:0}' -o table 2>/dev/null"

[ui]
preview_panel = { size = 60 }

[keybindings]
ctrl-o = "actions:open"
ctrl-n = "actions:create"
ctrl-b = "actions:checkout"
ctrl-y = "actions:copy"
ctrl-u = "actions:copylink"
ctrl-v = "actions:viewbuilds"

[actions.copy]
description = "Copy PR ID to clipboard"
command = "bash -c 'echo \"{split:\\t:0}\" | pbcopy'"
mode = "fork"

[actions.copylink]
description = "Copy PR link to clipboard"
command = "bash -c 'pr_id=\"{split:\\t:0}\"; web=$(az repos pr show --id \"$pr_id\" --query \"repository.webUrl\" -o tsv 2>/dev/null); echo \"$web/pullrequest/$pr_id\" | pbcopy'"
mode = "fork"

[actions.checkout]
description = "Checkout PR branch"
command = "az repos pr checkout --id '{split:\\t:0}'"
mode = "execute"

[actions.open]
description = "Open PR in browser"
command = "az repos pr show --id '{split:\\t:0}' --open 2>/dev/null"
mode = "fork"

[actions.create]
description = "Create new PR"
command = """zsh -c '
  branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
  key=$(echo "$branch" | grep -oiE "hydra-[0-9]+" | head -1 | tr "[:lower:]" "[:upper:]")

  if [[ -n "$key" ]]; then
    acli_output=$(acli jira workitem view "$key" --fields "summary" 2>/dev/null)
    summary=$(echo "$acli_output" | grep -i "^Summary:" | sed "s/Summary:[[:space:]]*//" )
    title="$key: $summary"
    desc="https://heineken.atlassian.net/browse/$key"
  else
    # No HYDRA key found - provide prefix for user to complete
    title="HYDRA-"
    desc=""
  fi

  # Use zsh vared for editable input (macOS compatible)
  vared -p "PR Title: " title
  vared -p "PR Description: " desc

  target=$(git branch -r 2>/dev/null | sed "s|origin/||" | sed "s/^[[:space:]]*//" | sort -u | fzf --prompt "Target branch > " --height 40% --reverse)
  if [[ -z "$target" ]]; then exit 0; fi

  az repos pr create --title "$title" --description "$desc" --target-branch "$target" --squash true --delete-source-branch true --open
'"""
mode = "execute"

[actions.viewbuilds]
description = "View builds for this PR"
command = "az pipelines build list --branch refs/pull/{split:\\t:0}/merge -o table | less"
mode = "fork"
