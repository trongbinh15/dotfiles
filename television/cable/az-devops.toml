[metadata]
name = "az-devops-pr"
description = "Azure DevOps pull requests — preview details, open in browser"
requirements = ["az"]

[source]
command = "az repos pr list --query \"[?isDraft==\\`false\\`].{id:pullRequestId, title:title, branch:sourceRefName, repo:repository.name}\" -o tsv 2>/dev/null"

[preview]
command = "az repos pr show --id '{split:\\t:0}' -o table 2>/dev/null"

[ui]
preview_panel = { size = 60 }

[keybindings]
ctrl-o = "actions:open"
ctrl-n = "actions:create"

[actions.open]
description = "Open PR in browser"
command = "az repos pr show --id '{split:\\t:0}' --open 2>/dev/null"
mode = "fork"

[actions.create]
description = "Create new PR"
command = """bash -c '
  printf "Title: "; read -r title

  ticket=$(acli jira workitem search --jql "project = HYDRA AND sprint in openSprints() AND assignee = currentUser() AND status != Done" --json 2>/dev/null \
    | jq -r '"'"'.[] | [.key, .fields.status.name, .fields.summary] | @tsv'"'"' \
    | fzf --prompt "Jira ticket > " --height 40% --reverse)
  if [[ -z "$ticket" ]]; then exit 0; fi

  key=$(echo "$ticket" | cut -f1)
  desc="https://heineken.atlassian.net/browse/$key"

  target=$(git branch -r 2>/dev/null | sed "s|origin/||" | sed "s/^[[:space:]]*//" | sort -u | fzf --prompt "Target branch > " --height 40% --reverse)
  if [[ -z "$target" ]]; then exit 0; fi

  az repos pr create --title "$title" --description "$desc" --target-branch "$target" --squash true --delete-source-branch true --open
'"""
mode = "execute"
